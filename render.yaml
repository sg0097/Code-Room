# Render blueprint: New → Blueprint → pick this repo. Database: a free Postgres on neon.tech
# (paste its connection string as DATABASE_URL when Render asks).
services:
  - type: web
    name: coderoom
    runtime: node
    plan: free
    # Same region as the Neon database (ap-southeast-1). A query then takes ~2 ms instead of ~160 ms.
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: SESSION_SECRET
        generateValue: true
      - key: WORKER_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      # Email for "forgot password" codes. Any SMTP provider works (Gmail app password, Brevo, ...).
      # Leave empty and the "Forgot password?" link is hidden.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
